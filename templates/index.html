<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Webhook Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .event-item {
            transition: all 0.3s ease;
            animation: slideIn 0.5s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .event-push { border-left: 4px solid #10B981; }
        .event-pr { border-left: 4px solid #3B82F6; }
        .event-merge { border-left: 4px solid #8B5CF6; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <header class="bg-white rounded-lg shadow-md p-6 mb-6 text-center">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">GitHub Webhook Monitor</h1>
            <p class="text-gray-600">Real-time updates from your GitHub repository</p>
        </header>

        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-semibold text-gray-800">Recent Activity</h2>
                <div class="flex items-center space-x-4">
                    <div class="flex items-center">
                        <span class="w-3 h-3 rounded-full bg-green-500 mr-2"></span>
                        <span id="eventCount" class="text-gray-600">0 events</span>
                    </div>
                    <span id="lastUpdate" class="text-sm text-gray-500">Last updated: Just now</span>
                </div>
            </div>

            <div id="eventsContainer" class="space-y-4">
                <!-- Events will be inserted here by JavaScript -->
                <div class="text-center py-10 text-gray-400" id="loadingIndicator">
                    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500 mx-auto mb-4"></div>
                    <p>Loading events...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let displayedEvents = new Set();
        let isFirstLoad = true;

        // Format timestamp to required format
        function formatTimestamp(timestamp) {
            if (!timestamp) return '';

            const date = new Date(timestamp);
            if (isNaN(date.getTime())) return '';

            const options = { 
                day: 'numeric', 
                month: 'long', 
                year: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit',
                hour12: true,
                timeZone: 'UTC',
                timeZoneName: 'short'
            };
            
            const formatted = date.toLocaleString('en-US', options);
            // Convert "AM/PM" to lowercase
            return formatted.replace(/(\d+:\d+)\s(AM|PM)/, (match, time, period) => {
                return `${time} ${period.toLowerCase()}`;
            });
        }

        // Create event HTML element based on event type
        function createEventElement(event) {
            const timestamp = formatTimestamp(event.timestamp);
            let html = '';
            
            if (event.type === 'push') {
                html = `
                    <div class="event-item event-push bg-white p-4 rounded-lg shadow-sm hover:shadow-md transition-shadow">
                        <div class="flex items-center">
                            <div class="mr-3 text-green-500">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" />
                                </svg>
                            </div>
                            <div>
                                <p class="text-gray-800">
                                    <span class="font-semibold">${event.author || 'Unknown'}</span> 
                                    pushed to 
                                    <span class="font-semibold">"${event.to_branch || 'unknown'}"</span> 
                                    on <span class="text-gray-600">${timestamp}</span>
                                </p>
                            </div>
                        </div>
                    </div>
                `;
            } else if (event.type === 'pull_request') {
                html = `
                    <div class="event-item event-pr bg-white p-4 rounded-lg shadow-sm hover:shadow-md transition-shadow">
                        <div class="flex items-center">
                            <div class="mr-3 text-blue-500">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                </svg>
                            </div>
                            <div>
                                <p class="text-gray-800">
                                    <span class="font-semibold">${event.author || 'Unknown'}</span> 
                                    submitted a pull request from 
                                    <span class="font-semibold">"${event.from_branch || 'unknown'}"</span> 
                                    to 
                                    <span class="font-semibold">"${event.to_branch || 'unknown'}"</span> 
                                    on <span class="text-gray-600">${timestamp}</span>
                                </p>
                            </div>
                        </div>
                    </div>
                `;
            } else if (event.type === 'merge') {
                html = `
                    <div class="event-item event-merge bg-white p-4 rounded-lg shadow-sm hover:shadow-md transition-shadow">
                        <div class="flex items-center">
                            <div class="mr-3 text-purple-500">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                                </svg>
                            </div>
                            <div>
                                <p class="text-gray-800">
                                    <span class="font-semibold">${event.author || 'Unknown'}</span> 
                                    merged branch 
                                    <span class="font-semibold">"${event.from_branch || 'unknown'}"</span> 
                                    to 
                                    <span class="font-semibold">"${event.to_branch || 'unknown'}"</span> 
                                    on <span class="text-gray-600">${timestamp}</span>
                                </p>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            return html;
        }

        // Fetch and display events
        async function fetchEvents() {
            try {
                const response = await fetch('/api/events');
                const events = await response.json();
                const container = document.getElementById('eventsContainer');
                const eventCount = document.getElementById('eventCount');
                const lastUpdate = document.getElementById('lastUpdate');

                // Hide loading indicator
                const loadingIndicator = document.getElementById('loadingIndicator');
                if (loadingIndicator) {
                    loadingIndicator.style.display = 'none';
                }

                if (!events || events.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-10 text-gray-500">
                            <p>No events found. Webhook events will appear here.</p>
                        </div>
                    `;
                    eventCount.textContent = '0 events';
                } else {
                    // Clear the container on first load
                    if (isFirstLoad) {
                        container.innerHTML = '';
                        isFirstLoad = false;
                    }

                    // Filter out events that are already displayed
                    const newEvents = events.filter(event => {
                        const eventId = `${event.request_id}-${event.timestamp}`;
                        return !displayedEvents.has(eventId);
                    });

                    // Add new events to the top
                    if (newEvents.length > 0) {
                        const newEventsHTML = newEvents.map(event => {
                            const eventId = `${event.request_id}-${event.timestamp}`;
                            displayedEvents.add(eventId);
                            return createEventElement(event);
                        }).join('');

                        container.insertAdjacentHTML('afterbegin', newEventsHTML);
                    }

                    eventCount.textContent = `${events.length} event${events.length !== 1 ? 's' : ''}`;
                }

                lastUpdate.textContent = `Last updated: ${new Date().toLocaleTimeString()}`;

            } catch (error) {
                console.error('Error fetching events:', error);
                const container = document.getElementById('eventsContainer');
                container.innerHTML = `
                    <div class="text-center py-10 text-red-500">
                        <p>Error loading events. Please check the console for details.</p>
                    </div>
                `;
            }
        }

        // Initial fetch
        fetchEvents();

        // Poll for new events every 15 seconds
        setInterval(fetchEvents, 15000);
    </script>
</body>
</html>
